<body>
<title>How Many Oranges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
:root{
  --ground:#E9ECE2;
  --surface:#FFFDF7;
  --surface-2:#DDE3D5;
  --ink:#16302C;
  --ink-soft:#56675F;
  --line:#C3CCBA;
  --line-strong:#9EAB94;
  --accent:#E09612;
  --accent-ink:#5E3D00;
  --coral:#D04E35;
  --good:#2C7A58;
  --shadow:0 1px 0 rgba(22,48,44,.10), 0 10px 28px -18px rgba(22,48,44,.55);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101F1D;
    --surface:#172D29;
    --surface-2:#1F3C35;
    --ink:#E9F0E6;
    --ink-soft:#99AEA4;
    --line:#2C4F47;
    --line-strong:#3E6A5F;
    --accent:#F0B23E;
    --accent-ink:#17211A;
    --coral:#EC7257;
    --good:#4FB084;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#101F1D;
  --surface:#172D29;
  --surface-2:#1F3C35;
  --ink:#E9F0E6;
  --ink-soft:#99AEA4;
  --line:#2C4F47;
  --line-strong:#3E6A5F;
  --accent:#F0B23E;
  --accent-ink:#17211A;
  --coral:#EC7257;
  --good:#4FB084;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -18px rgba(0,0,0,.9);
}

html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit}

.wrap{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding-inline:16px;
  padding-block:24px;
}
.card{
  width:100%;
  max-width:620px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* ---- shared bits ---- */
.eyebrow{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--ink-soft);
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:var(--surface-2);
}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:9px;height:9px;border-radius:50%;background:var(--line-strong);opacity:.45}
.pip.done{opacity:1;background:var(--good)}
.pip.miss{opacity:1;background:var(--line-strong)}
.pip.now{opacity:1;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
.score-readout{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.score-readout span{color:var(--ink-soft);font-weight:500}

.body{padding:24px 20px 26px}
@media (min-width:520px){ .body{padding:30px 32px 32px} }

h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}

/* ---- title screen ---- */
.hero-mark{
  font-size:34px;
  line-height:1;
  letter-spacing:-.04em;
  margin-bottom:14px;
}
.title-h1{font-size:clamp(30px,7vw,42px);line-height:1.04;margin-bottom:10px}
.title-h1 em{font-style:italic;color:var(--accent)}
.lede{color:var(--ink-soft);max-width:44ch;margin:0 0 4px}
.sample{
  margin:20px 0 26px;
  padding:14px 16px;
  border-left:3px solid var(--accent);
  background:var(--surface-2);
  border-radius:0 10px 10px 0;
  font-family:"Fraunces",Georgia,serif;
  font-size:17px;
  line-height:1.35;
}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.age-btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:104px;text-align:center;
  padding:22px 4px;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:14px;
  cursor:pointer;
  transition:border-color .14s ease, transform .14s ease, background .14s ease;
}
.age-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.age-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.age-btn b{
  font-family:"Fraunces",Georgia,serif;
  font-size:clamp(17px,4.4vw,25px);
  line-height:1.1;
  white-space:nowrap;
}
.age-btn:hover b{color:var(--ink)}
.best-line{margin-top:18px;font-size:13px;color:var(--ink-soft)}

/* ---- question ---- */
.unit-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:4px 11px 4px 8px;
  border-radius:999px;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
}
.question{
  font-family:"Fraunces",Georgia,serif;
  font-size:clamp(22px,5.2vw,30px);
  line-height:1.2;
  margin:16px 0 0;
}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;
  background:none;border:none;
  padding:8px 11px 8px 7px;margin:-8px 0 -8px -7px;
  border-radius:9px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--ink-soft);cursor:pointer;
  transition:color .12s ease, background .12s ease;
}
.backbtn:hover{color:var(--ink);background:var(--surface)}
.backbtn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.backbtn .chev{font-size:16px;line-height:1;margin-top:-2px;letter-spacing:0}
.share{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.share-text{
  margin:0 0 12px;
  padding:13px 14px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:11px;
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-x:auto;
  color:var(--ink);
}
.share-note{margin:10px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.btn.ghost.wide{margin-top:14px}
.orients{
  margin:9px 0 0;
  font-size:12.5px;
  line-height:1.45;
  color:var(--ink-soft);
  letter-spacing:.01em;
}
.glyphs{font-size:30px;line-height:1;margin-top:18px;letter-spacing:.06em}
.glyphs .arrow{font-size:17px;color:var(--ink-soft);margin:0 8px;font-family:"Archivo",sans-serif}

.hint{
  margin-top:18px;
  font-size:14px;
  color:var(--ink-soft);
  border-top:1px dashed var(--line);
  padding-top:14px;
}
.hint b{color:var(--ink);font-weight:600}
.hint-btn{
  background:none;border:none;padding:0;
  color:var(--ink-soft);text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;font-size:14px;
}

/* ---- guess controls ---- */
.guessbox{margin-top:26px}
.guess-display{
  font-family:"Fraunces",Georgia,serif;
  font-size:clamp(34px,9vw,46px);
  font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums;
  margin-bottom:2px;
}
.guess-unit{font-size:13px;color:var(--ink-soft);margin-bottom:16px}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:30px;background:transparent;cursor:grab;margin:0;
}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-runnable-track{
  height:8px;border-radius:999px;
  background:linear-gradient(90deg,var(--surface-2),var(--line-strong));
  border:1px solid var(--line);
}
input[type=range]::-moz-range-track{
  height:8px;border-radius:999px;
  background:linear-gradient(90deg,var(--surface-2),var(--line-strong));
  border:1px solid var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:30px;height:30px;margin-top:-12px;
  border-radius:50%;
  background:var(--accent);
  border:3px solid var(--surface);
  box-shadow:0 2px 8px -2px rgba(0,0,0,.45);
}
input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;
  background:var(--accent);border:3px solid var(--surface);
  box-shadow:0 2px 8px -2px rgba(0,0,0,.45);
}
input[type=range]:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:999px}

.ticks{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  margin-top:-2px;letter-spacing:.04em;
}

.numrow{display:flex;gap:10px;align-items:stretch;margin-top:4px}
input[type=text].numinput{
  flex:1;min-width:0;
  font-family:"Fraunces",Georgia,serif;
  font-size:26px;font-weight:700;
  font-variant-numeric:tabular-nums;
  padding:12px 14px;
  background:var(--surface-2);
  color:var(--ink);
  border:1.5px solid var(--line);
  border-radius:11px;
}
input[type=text].numinput:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[type=text].numinput::placeholder{color:var(--ink-soft);font-weight:500;opacity:.7}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;
  background:var(--ink);
  color:var(--surface);
  border:1.5px solid var(--ink);
  border-radius:11px;
  font-weight:600;font-size:15px;
  cursor:pointer;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.wide{width:100%;margin-top:18px}

/* ---- reveal ---- */
.verdict{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.verdict h2{font-size:clamp(24px,6vw,32px)}
.verdict .pts{
  font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
  padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);
}
.tone-good h2{color:var(--good)}
.tone-warn h2{color:var(--accent)}
.tone-bad h2{color:var(--coral)}

.answer-line{
  font-family:"Fraunces",Georgia,serif;
  font-size:clamp(20px,5vw,26px);
  line-height:1.25;
  margin:14px 0 0;
}
.answer-line b{color:var(--accent)}

/* log number line */
.scale{margin:26px 0 6px}
.scale-track{
  position:relative;height:10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);
}
.scale-band{
  position:absolute;top:-1px;bottom:-1px;
  background:color-mix(in srgb, var(--good) 32%, transparent);
  border-left:1px solid var(--good);border-right:1px solid var(--good);
  border-radius:3px;
}
.marker{position:absolute;top:50%;transform:translate(-50%,-50%);}
.marker .dot{
  width:16px;height:16px;border-radius:50%;
  border:3px solid var(--surface);
  box-shadow:0 1px 5px -1px rgba(0,0,0,.5);
}
.marker.you .dot{background:var(--coral)}
.marker.ans .dot{background:var(--ink)}
.marker .tag{
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.marker.you .tag{top:16px;color:var(--coral)}
.marker.ans .tag{bottom:16px;color:var(--ink)}
.scale-ends{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--ink-soft);margin-top:30px;
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
}

.math{
  margin-top:22px;
  border-top:1px solid var(--line);
  padding-top:16px;
  display:grid;gap:8px;
}
.math-row{display:flex;gap:10px;align-items:baseline;font-size:14.5px}
.math-row .g{font-size:17px;line-height:1;width:24px;flex:none;text-align:center}
.math-row b{font-weight:600}
.math .sum{
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);font-size:13.5px;
  padding-top:4px;border-top:1px dashed var(--line);margin-top:2px;
}
.fact{
  margin-top:14px;font-size:13.5px;color:var(--ink-soft);
  background:var(--surface-2);border-radius:10px;padding:10px 13px;
}
.fact b{color:var(--ink);font-weight:600;letter-spacing:.1em;font-size:10.5px;text-transform:uppercase}

/* ---- summary ---- */
.final{font-size:clamp(44px,13vw,64px);font-family:"Fraunces",Georgia,serif;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.final-sub{color:var(--ink-soft);margin-top:4px}
.recap{margin-top:24px;display:grid;gap:0;border-top:1px solid var(--line)}
.recap-row{
  display:flex;gap:12px;align-items:center;
  padding:11px 2px;border-bottom:1px solid var(--line);
  font-size:14px;
}
.recap-row .g{font-size:18px;line-height:1;flex:none}
.recap-row .txt{flex:1;min-width:0;color:var(--ink-soft);line-height:1.3}
.recap-row .txt b{color:var(--ink);font-weight:600}
.recap-row .rk{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  flex:none;
}
.btnrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:140px}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<div class="wrap">
  <main class="card" id="card"></main>
</div>

/* ---------------------- difficulty bands ----------------------
   Everyone gets the SAME question every day. The age band changes only how
   much help you get, and whether you drag the number or type it. Scoring
   tolerance is deliberately identical for all three: if a 7-year-old's
   "bullseye" were looser than a grown-up's, a shared score would not mean
   the same thing from one player to the next. */

  "6-9":   {label:"6 \u2013 9",  blurb:"The first measurement is always shown to you.",  input:"slider", hint:"always"},
  "10-12": {label:"10 \u2013 12",blurb:"A hint is there if you want it \u2014 tap to reveal.", input:"slider", hint:"ondemand"},
  "13+":   {label:"13 +",     blurb:"No hints, and you type the number yourself.",   input:"number", hint:"never"}
};

/* One rule for every player. */
const RULE = {sliderMax:1e6, minAnswer:20, maxAnswer:1e5,
              perfect:2.5, great:6, ok:15, famWeight:[3,3,2]};

/* A "measure" is an object paired with one specific orientation: a paper clip
   lying flat and a paper clip standing on its end are two different measures
   with two different answers, so the sentence always says which one it means. */
const qMid = m => m.or ? `, ${m.or},` : "";
const qEnd = m => m.or ? `, ${m.or}` : "";
const val = (m,k) => {
  const v = (typeof m.val==="number") ? m.val : m[k];
  return (typeof v==="number" && isFinite(v) && v>0) ? v : null;
};

     ask:(i,t)=>`How many ${i.p} of water would it take to fill ${t.n}?`,
     say:(m)=>{const v=val(m,"v"); return v===null?"":`${cap(m.n)} holds about ${fmtVol(v)}.`;}},
  t:{key:"t", word:"Time", glyph:"\u23f3",
     ask:(i,t)=>`How many ${i.p} would take as long as ${t.n}?`,
     say:(m)=>{const v=val(m,"t"); return v===null?"":`${cap(m.n)} ${m.tv||"takes about"} ${fmtTime(v)}.`;}}
};
const UNIT_PICK = ["h","h","h","h","w","w","w","w","v","t","t","t"];

/* ---------------------- formatting ---------------------- */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function sig(x){
  if(typeof x!=="number"||!isFinite(x)) return "?";
  if(x>=1000) return Math.round(x).toLocaleString("en-US");
  if(x>=100) return Math.round(x).toString();
  if(x>=10) return (Math.round(x*10)/10).toString();
  if(x>=1) return (Math.round(x*10)/10).toString();
  return parseFloat(x.toPrecision(2)).toString();
}
function plural(val,word){ return sig(val)+" "+word+(Math.round(val*10)/10===1?"":"s"); }

function fmtCount(n){
  if(n>=1e12) return sig(n/1e12)+" trillion";
  if(n>=1e9)  return sig(n/1e9)+" billion";
  if(n>=1e6)  return sig(n/1e6)+" million";
  if(n>=1)    return Math.round(n).toLocaleString("en-US");
  return parseFloat(n.toPrecision(2)).toString();
}
function fmtLen(m){
  const inch=m*39.3701;
  if(inch<24) return sig(inch)+" in";
  const ft=m*3.28084;
  if(ft<5280) return sig(ft)+" ft";
  return plural(ft/5280,"mile");
}
function fmtMass(kg){
  if(kg<0.001) return sig(kg*1000)+" g";
  const oz=kg*35.274;
  if(oz<16) return sig(oz)+" oz";
  const lb=kg*2.20462;
  if(lb<2000) return sig(lb)+" lb";
  return plural(lb/2000,"ton");
}
function fmtVol(L){
  const floz=L*33.814;
  if(floz<64) return sig(floz)+" fl oz";
  return plural(L*0.264172,"gallon");
}
function fmtTime(s){
  if(s<60) return plural(s,"second");
  if(s<3600) return plural(s/60,"minute");
  if(s<172800) return plural(s/3600,"hour");
  if(s<3.0e7) return plural(s/86400,"day");
  return plural(s/31557600,"year");
}

/* ---------------------- question generation ---------------------- */
const MEASURES={};
function measures(u){
  if(MEASURES[u]) return MEASURES[u];
  const out=[];
  for(const o of OBJECTS){
    if(typeof o[u]==="number") out.push({...o, val:o[u], or:(u==="h"?(o.ho||null):null)});
    if(u==="h" && typeof o.h2==="number") out.push({...o, val:o.h2, or:o.h2o||null});
  }
  return (MEASURES[u]=out);
}

/* A question is only worth asking if the thing you are measuring UP TO is
   worth picturing. Targets come from the largest 40% of each unit's pool,
   which is what separates "as tall as the Space Needle" from "as tall as a
   pancake". */
const FLOORS={};
function targetFloor(u){
  if(FLOORS[u]!==undefined) return FLOORS[u];
  const vals=measures(u).map(m=>m.val).sort((x,y)=>x-y);
  return (FLOORS[u]=vals[Math.floor(vals.length*0.6)]);
}
function weightOf(o){ return RULE.famWeight[o.f]; }
function pickWeighted(list){
  let total=0; for(const o of list) total+=weightOf(o);
  let r=Math.random()*total;
  for(const o of list){ r-=weightOf(o); if(r<=0) return o; }
  return list[list.length-1];
}

/* ---- the daily puzzle ----
   Every player, anywhere, gets the same question on the same date with no
   server involved. The year's schedule is a deterministic shuffle of every
   valid pairing, so a day's question is a pure function of its number, and
   a pairing never repeats until its whole list has been used. */
const EPOCH = Date.UTC(2026,9,26);   // launch day \u2014 October 26, 2026 is puzzle #1
function puzzleNumber(d){
  d = d || new Date();
  return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/86400000)+1;
}
function mulberry32(a){
  return function(){ a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
}
const WEEK=["h","w","t","h","v","w","t"];   // a week never repeats a unit back to back
const SCHEDULE={};
function schedule(u){
  if(SCHEDULE[u]) return SCHEDULE[u];
  const pool=measures(u), floor=targetFloor(u), out=[];
  for(const t of pool){
    if(t.val<floor) continue;
    for(const i of pool){
      if(!i.p || i.n===t.n) continue;
      const r=t.val/i.val;
      if(r>=RULE.minAnswer && r<=RULE.maxAnswer) out.push([i,t]);
    }
  }
  const rnd=mulberry32((0x9E3779B9 ^ u.charCodeAt(0))>>>0);
  for(let k=out.length-1;k>0;k--){ const j=Math.floor(rnd()*(k+1)); const tmp=out[k]; out[k]=out[j]; out[j]=tmp; }
  return (SCHEDULE[u]=out);
}
function unitIndex(n,u){
  const per=WEEK.filter(x=>x===u).length;
  let c=Math.floor((n-1)/7)*per;
  for(let i=0;i<(n-1)%7;i++) if(WEEK[i]===u) c++;
  return c;
}
function dailyQuestion(n){
  const u=WEEK[(n-1)%WEEK.length], list=schedule(u);
  const pair=list[unitIndex(n,u)%list.length];
  return {u, item:pair[0], target:pair[1], answer:pair[1].val/pair[0].val};
}

/* ---- practice questions: random, same quality bar ---- */
function practiceQuestion(seen){
  for(let attempt=0; attempt<400; attempt++){
    const u=WEEK[Math.floor(Math.random()*WEEK.length)];
    const pool=measures(u), floor=targetFloor(u);
    const big=pool.filter(m=>m.val>=floor);
    if(!big.length) continue;
    const target=pickWeighted(big);
    const items=pool.filter(m=>{
      if(m.n===target.n || !m.p) return false;
      const r=target.val/m.val;
      return r>=RULE.minAnswer && r<=RULE.maxAnswer;
    });
    if(!items.length) continue;
    const item=pickWeighted(items);
    const key=u+"|"+item.n+"|"+item.or+"|"+target.n+"|"+target.or;
    if(seen.has(key)||seen.has("t:"+target.n)) continue;
    seen.add(key); seen.add("t:"+target.n);
    return {u, item, target, answer: target.val/item.val};
  }
  return dailyQuestion(Math.floor(Math.random()*1000)+1);
}

/* ---------------------- scoring ---------------------- */
function grade(guess,answer){
  const r = guess>0 ? Math.max(guess/answer, answer/guess) : Infinity;
  if(r<=RULE.perfect) return {label:"Bullseye",   pts:1000, tone:"good", r};
  if(r<=RULE.great)   return {label:"Great guess",pts:600,  tone:"good", r};
  if(r<=RULE.ok)      return {label:"Close",      pts:300,  tone:"warn", r};
  if(r<=100)          return {label:"Off by a lot",pts:75,  tone:"warn", r};
  return {label:"Way off", pts:0, tone:"bad", r};
}

/* ---------------------- storage ---------------------- */
/* Where "can you beat it?" should point. When this page is the top-level
   document — on any host, anywhere — its own address is the right link.
   Inside the Artifact viewer the page runs in a frame whose address is not
   shareable, and reading window.top across origins throws, so that throw is
   exactly the signal to fall back to the published link. */
const HOME_URL="https://claude.ai/artifact/R756J9tLjcPkXyrjuiTksX";
function shareUrl(){
  try{
    if(window.top===window.self && /^https?:/.test(location.href))
      return location.origin+location.pathname;
  }catch(e){}
  return HOME_URL;
}
const PRACTICE_LENGTH=5;
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function recallJSON(k){ try{ return JSON.parse(recall(k)||"null"); }catch(e){ return null; } }
function savedBand(){ const b=recall("hmo.band"); return BANDS[b]?b:null; }
function todaysResult(){ const r=recallJSON("hmo.daily"); return (r&&r.n===puzzleNumber())?r:null; }
function readStreak(){ return recallJSON("hmo.streak")||{last:0,count:0}; }
function bumpStreak(n){
  const s=readStreak();
  if(s.last===n) return s;
  const out={last:n, count:(s.last===n-1 ? s.count+1 : 1)};
  store("hmo.streak",JSON.stringify(out));
  return out;
}

/* ---------------------- state ---------------------- */
let S=null;
let showAges=false;   // set when the player backs out to change age group
const card=document.getElementById("card");

function startDaily(bandKey){
  store("hmo.band",bandKey); showAges=false;
  const n=puzzleNumber(), prev=todaysResult();
  S={mode:"daily", bandKey, band:BANDS[bandKey], n, q:dailyQuestion(n),
     phase: prev?"result":"play", guess: prev?prev.guess:null, hintShown:true};
  // Changing age after you have answered must not hand you a second attempt.
  if(!prev) resetGuess();
  render();
}
function startPractice(bandKey){
  showAges=false;
  S={mode:"practice", bandKey, band:BANDS[bandKey], i:0, score:0,
     results:[], seen:new Set(), phase:"play"};
  S.q=practiceQuestion(S.seen);
  resetGuess();
  render();
}
function resetGuess(){
  S.guess = S.band.input==="slider" ? roundNice(Math.sqrt(RULE.sliderMax)) : null;
  S.sliderT = S.band.input==="slider" ? 500 : null;
  S.hintShown = S.band.hint==="always";
}

/* ---------------------- log-slider mapping ---------------------- */
function tToValue(t,max){ return Math.pow(10,(t/1000)*Math.log10(max)); }
function roundNice(v){
  if(v<10) return Math.max(1,Math.round(v));
  const mag=Math.pow(10,Math.floor(Math.log10(v))-1);
  return Math.round(v/mag)*mag;
}
function logPos(v,max){
  const p=Math.log10(Math.max(v,1))/Math.log10(max);
  return Math.min(100,Math.max(0,p*100));
}
function tickShort(e){
  if(e>=9) return (e>9?Math.pow(10,e-9):1)+"B";
  if(e>=6) return Math.pow(10,e-6)+"M";
  if(e>=3) return Math.pow(10,e-3)+"K";
  return String(Math.pow(10,e));
}
function tickLabels(max){
  const top=Math.round(Math.log10(max));
  const step=Math.max(1,Math.ceil(top/4));
  const out=[];
  for(let e=0;e<=top;e+=step) out.push(e);
  if(out[out.length-1]!==top) out.push(top);
  return out.map(tickShort);
}

/* ---------------------- screens ---------------------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Orientation is only disclosed when it changes the answer. */
function orientNote(q){
  const bits=[];
  if(q.item.or)   bits.push(`${q.item.n} ${q.item.or}`);
  if(q.target.or) bits.push(`${q.target.n} ${q.target.or}`);
  if(!bits.length) return "";
  return `<p class="orients">${bits.map(esc).join(" &middot; ")}</p>`;
}
function puzzleDate(){
  return new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
}

function renderTitle(){
  const n=puzzleNumber(), played=todaysResult(), s=readStreak();
  const band=showAges?null:savedBand();
  const streakLine = s.count>0 && (s.last===n||s.last===n-1)
    ? `<p class="best-line">🔥 ${s.count}-day streak</p>` : "";
  let action;
  if(played){
    action = `<button class="btn wide" id="seeResult">See today's result</button>
              <button class="btn ghost wide" id="toPractice">Keep playing — practice mode</button>`;
  } else if(band){
    action = `<button class="btn wide" id="playNow">Play puzzle #${n}</button>
              <p class="best-line">Playing as ages ${esc(BANDS[band].label)} &middot;
                 <button class="hint-btn" id="changeAge">change</button></p>`;
  } else {
    action = `<p class="eyebrow" style="margin-bottom:10px">How old are you?</p>
      <div class="ages">${Object.keys(BANDS).map(k=>`
          <button class="age-btn" data-band="${k}" aria-label="Ages ${BANDS[k].label}">
            <b>${BANDS[k].label}</b>
          </button>`).join("")}</div>
      <p class="best-line">Everyone gets the same puzzle. Age only changes how much help you get.</p>`;
  }
  card.innerHTML = `
    <div class="body">
      <div class="hero-mark">🍊 📏 🐻 ⏳</div>
      <h1 class="title-h1">How Many <em>Oranges</em>?</h1>
      <p class="eyebrow" style="margin:2px 0 12px">Puzzle #${n} &middot; ${puzzleDate()}</p>
      <p class="lede">Compete against your friends and family in a game of estimation!</p>
      ${streakLine}
      <div style="margin-top:22px">${action}</div>
    </div>`;

  const on=(id,fn)=>{ const el=card.querySelector("#"+id); if(el) el.addEventListener("click",fn); };
  card.querySelectorAll(".age-btn").forEach(b=>b.addEventListener("click",()=>startDaily(b.dataset.band)));
  on("playNow",()=>startDaily(band));
  on("changeAge",()=>{ showAges=true; render(); });
  on("seeResult",()=>{
    const r=todaysResult();
    S={mode:"daily", bandKey:r.band, band:BANDS[r.band]||BANDS["10-12"], n, q:dailyQuestion(n),
       phase:"result", guess:r.guess, hintShown:true};
    render();
  });
  on("toPractice",()=>startPractice(savedBand()||"10-12"));
}

function topbar(){
  // The way out is offered only while the question is still unanswered.
  const label = S.mode==="daily" ? "Ages "+S.band.label : "Exit practice";
  const left = S.phase==="play"
    ? `<button class="backbtn" id="backBtn" aria-label="Go back and choose a different age group"><span class="chev" aria-hidden="true">\u2039</span>${esc(label)}</button>`
    : `<div class="eyebrow">${esc(S.mode==="daily"?"Ages "+S.band.label:"Practice")}</div>`;
  if(S.mode==="daily"){
    return `<div class="topbar">${left}<div class="eyebrow">Puzzle #${S.n}</div></div>`;
  }
  let pips="";
  for(let k=0;k<PRACTICE_LENGTH;k++){
    const res=S.results[k];
    pips+=`<i class="pip ${res?(res.pts>=600?"done":"miss"):(k===S.i?"now":"")}"></i>`;
  }
  return `<div class="topbar">
    ${left}
    <div class="pips">${pips}</div>
    <div class="score-readout">${S.score.toLocaleString("en-US")} <span>pts</span></div>
  </div>`;
}

let playKeys=null;
function renderPlay(){
  const {q,band}=S, U=UNITS[q.u];
  const hintHTML = S.hintShown
    ? `<div class="hint"><b>Hint:</b> ${esc(U.say(q.item))}</div>`
    : (band.hint==="ondemand" ? `<div class="hint"><button class="hint-btn" id="hintBtn">Show me a hint</button></div>` : "");

  const controls = band.input==="slider" ? `
      <div class="guess-display" id="guessOut">${fmtCount(S.guess)}</div>
      <div class="guess-unit">${esc(q.item.p)}</div>
      <input type="range" id="slider" min="0" max="1000" step="1" value="${S.sliderT}"
             aria-label="Your guess, from 1 to ${fmtCount(RULE.sliderMax)}">
      <div class="ticks">${tickLabels(RULE.sliderMax).map(t=>`<span>${t}</span>`).join("")}</div>
      <button class="btn wide" id="lockBtn">Lock it in</button>`
    : `
      <div class="guess-unit" style="margin-bottom:8px">Your guess, in ${esc(q.item.p)}</div>
      <div class="numrow">
        <input type="text" class="numinput" id="numinput" inputmode="numeric"
               autocomplete="off" placeholder="0" aria-label="Your guess in ${esc(q.item.p)}">
        <button class="btn" id="lockBtn" disabled>Lock in</button>
      </div>`;

  card.innerHTML = topbar()+`
    <div class="body">
      <span class="unit-chip">${U.glyph} ${U.word}</span>
      <h2 class="question">${esc(U.ask(q.item,q.target))}</h2>
      ${orientNote(q)}
      <div class="glyphs">${q.item.e}<span class="arrow">how many &rarr;</span>${q.target.e}</div>
      ${hintHTML}
      <div class="guessbox">${controls}</div>
    </div>`;

  const lock=card.querySelector("#lockBtn"), hb=card.querySelector("#hintBtn");
  if(hb) hb.addEventListener("click",()=>{ S.hintShown=true; render(); });

  const goBack=()=>{ showAges=true; S=null; render(); };
  card.querySelector("#backBtn").addEventListener("click",goBack);
  document.removeEventListener("keydown",playKeys);
  playKeys=e=>{ if(e.key==="Escape" && S && S.phase==="play") goBack(); };
  document.addEventListener("keydown",playKeys);

  if(band.input==="slider"){
    const sl=card.querySelector("#slider"), out=card.querySelector("#guessOut");
    const sync=()=>{ S.sliderT=+sl.value; S.guess=roundNice(tToValue(S.sliderT,RULE.sliderMax));
                     out.textContent=fmtCount(S.guess); };
    sl.addEventListener("input",sync); sync();
    lock.addEventListener("click",submit);
  } else {
    const inp=card.querySelector("#numinput");
    const parse=()=>{ const v=parseFloat(inp.value.replace(/[, ]/g,"")); return (isFinite(v)&&v>0)?v:null; };
    inp.addEventListener("input",()=>{ lock.disabled=parse()===null; });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&parse()!==null){ S.guess=parse(); submit(); } });
    lock.addEventListener("click",()=>{ const v=parse(); if(v!==null){ S.guess=v; submit(); } });
    inp.focus();
  }
}

function submit(){
  if(S.mode==="daily"){
    const g=grade(S.guess,S.q.answer);
    store("hmo.daily",JSON.stringify({n:S.n,guess:S.guess,pts:g.pts,band:S.bandKey}));
    bumpStreak(S.n);
    S.phase="result";
  } else {
    const g=grade(S.guess,S.q.answer);
    S.score+=g.pts;
    S.results[S.i]={...g, guess:S.guess, q:S.q};
    S.phase="reveal";
  }
  render();
}

/* the log number line, shared by both result screens */
function scaleHTML(guess,answer){
  const max=RULE.sliderMax;
  const lo=answer/RULE.perfect, hi=answer*RULE.perfect;
  const bandL=logPos(lo,max), bandR=logPos(hi,max);
  return `<div class="scale">
      <div class="scale-track">
        <div class="scale-band" style="left:${bandL}%;width:${Math.max(bandR-bandL,0.8)}%"></div>
        <div class="marker ans" style="left:${logPos(answer,max)}%"><div class="dot"></div><div class="tag">answer</div></div>
        <div class="marker you" style="left:${logPos(guess,max)}%"><div class="dot"></div><div class="tag">you</div></div>
      </div>
      <div class="scale-ends">${tickLabels(max).map(t=>`<span>${t}</span>`).join("")}</div>
    </div>`;
}
function mathHTML(q,guess){
  const U=UNITS[q.u];
  const rows=[U.say(q.item),U.say(q.target)].filter(Boolean);
  const g=[q.item.e,q.target.e];
  return `<div class="math">
      ${rows.map((r,k)=>`<div class="math-row"><span class="g">${g[k]}</span><span>${esc(r)}</span></div>`).join("")}
      <div class="sum">You guessed ${fmtCount(guess)} &middot; the answer is ${fmtCount(q.answer)}</div>
    </div>`;
}
function offByText(r){
  return r<1.05 ? "spot on" : r<2 ? `off by ${(Math.round(r*10)/10)}×` : `off by ${fmtCount(Math.round(r))}×`;
}

/* ---- Wordle-style share: the number line, as eleven squares ---- */
function shareStrip(guess,answer){
  const cells=11, max=RULE.sliderMax;
  const pos=v=>Math.min(cells-1,Math.max(0,Math.round(Math.log10(Math.max(v,1))/Math.log10(max)*(cells-1))));
  const a=pos(answer), g=pos(guess);
  let out="";
  for(let i=0;i<cells;i++) out += (i===a&&i===g)?"🎯":(i===a?"🟩":(i===g?"🟥":"⬜"));
  return out;
}
function shareText(q,guess,gr,n,streakCount){
  const lines=[
    `How Many Oranges #${n}`,
    UNITS[q.u].ask(q.item,q.target),
    shareStrip(guess,q.answer),
    cap(offByText(gr.r)) + ` \u00b7 ${gr.pts} pts` + (streakCount>1?` \u00b7 \ud83d\udd25 ${streakCount} days`:""),
    `Can you beat it? ${shareUrl()}`
  ];
  return lines.join("\n");
}

function renderDailyResult(){
  const q=S.q, gr=grade(S.guess,q.answer), s=readStreak();
  const fact=q.target.fact||q.item.fact;
  const txt=shareText(q,S.guess,gr,S.n,s.count);
  // On a public host anyone with the link can play; inside the Artifact
  // viewer the link only opens for people the owner has shared it with.
  const gated = shareUrl()===HOME_URL;
  const note = gated ? "Anyone you send this to needs access to the puzzle link."
                     : "Anyone with the link can play \u2014 no account needed.";
  card.innerHTML = topbar()+`
    <div class="body tone-${gr.tone}">
      <div class="verdict">
        <h2>${gr.label}</h2>
        <span class="pts">${gr.pts} pts &middot; ${offByText(gr.r)}</span>
      </div>
      <p class="answer-line">It takes <b>${fmtCount(q.answer)}</b> ${esc(q.item.p)}.</p>
      ${scaleHTML(S.guess,q.answer)}
      ${mathHTML(q,S.guess)}
      ${fact?`<div class="fact"><b>Also</b><br>${esc(fact)}</div>`:""}
      <div class="share">
        <div class="eyebrow" style="margin-bottom:8px">Share your score</div>
        <pre class="share-text" id="shareText">${esc(txt)}</pre>
        <button class="btn wide" id="copyBtn">Copy &amp; challenge a friend</button>
        <p class="share-note" id="copyNote">${note}</p>
      </div>
      <button class="btn ghost wide" id="toPractice">Keep playing — practice mode</button>
      <p class="best-line">Come back tomorrow for puzzle #${S.n+1}.</p>
    </div>`;

  card.querySelector("#copyBtn").addEventListener("click",async e=>{
    const note=card.querySelector("#copyNote");
    try{
      await navigator.clipboard.writeText(txt);
      e.target.textContent="Copied";
      note.textContent="Paste it anywhere \u2014 text, email, chat.";
    }catch(err){
      // clipboard is often blocked in a sandboxed frame — select it instead
      const pre=card.querySelector("#shareText");
      const r=document.createRange(); r.selectNodeContents(pre);
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      e.target.textContent="Select all — now press copy";
      note.textContent="Your browser blocked the clipboard, so the text is selected for you.";
    }
  });
  card.querySelector("#toPractice").addEventListener("click",()=>startPractice(S.bandKey));
}

function renderPracticeReveal(){
  const q=S.q, res=S.results[S.i], fact=q.target.fact||q.item.fact;
  card.innerHTML = topbar()+`
    <div class="body tone-${res.tone}">
      <div class="verdict">
        <h2>${res.label}</h2>
        <span class="pts">+${res.pts} pts &middot; ${offByText(res.r)}</span>
      </div>
      <p class="answer-line">It takes <b>${fmtCount(q.answer)}</b> ${esc(q.item.p)}.</p>
      ${scaleHTML(S.guess,q.answer)}
      ${mathHTML(q,S.guess)}
      ${fact?`<div class="fact"><b>Also</b><br>${esc(fact)}</div>`:""}
      <button class="btn wide" id="nextBtn">${S.i+1>=PRACTICE_LENGTH?"See your score":"Next question"}</button>
    </div>`;
  const nb=card.querySelector("#nextBtn");
  nb.addEventListener("click",()=>{
    S.i++;
    if(S.i>=PRACTICE_LENGTH){ S.phase="summary"; }
    else { S.q=practiceQuestion(S.seen); S.phase="play"; resetGuess(); }
    render();
  });
  nb.focus();
}

function renderPracticeSummary(){
  const max=PRACTICE_LENGTH*1000;
  const bullseyes=S.results.filter(r=>r.pts===1000).length;
  const pct=S.score/max;
  const verdict = pct>=0.85 ? "You have a serious feel for scale."
    : pct>=0.6 ? "Solid estimating. The big ones are getting away from you."
    : pct>=0.35 ? "Right neighbourhood, wrong street."
    : "Orders of magnitude are sneaky. Try the hints.";
  card.innerHTML = `
    <div class="topbar"><div class="eyebrow">Practice round complete</div>
      <div class="eyebrow">Ages ${esc(S.band.label)}</div></div>
    <div class="body">
      <div class="final">${S.score.toLocaleString("en-US")}</div>
      <div class="final-sub">out of ${max.toLocaleString("en-US")} &middot; ${bullseyes} bullseye${bullseyes===1?"":"s"}</div>
      <p class="lede" style="margin-top:14px">${verdict}</p>
      <div class="recap">
        ${S.results.map(r=>`
          <div class="recap-row">
            <span class="g">${r.q.item.e}</span>
            <span class="txt">${esc(r.q.item.p)}${r.q.item.or?" ("+esc(r.q.item.or)+")":""} &rarr; ${esc(r.q.target.n)}${r.q.target.or?" ("+esc(r.q.target.or)+")":""}<br>
              you ${fmtCount(r.guess)} &middot; answer <b>${fmtCount(r.q.answer)}</b></span>
            <span class="rk" style="color:var(--${r.tone==="good"?"good":r.tone==="warn"?"accent":"coral"})">${r.label}</span>
          </div>`).join("")}
      </div>
      <div class="btnrow">
        <button class="btn" id="again">Another round</button>
        <button class="btn ghost" id="home">Back to today</button>
      </div>
    </div>`;
  card.querySelector("#again").addEventListener("click",()=>startPractice(S.bandKey));
  card.querySelector("#home").addEventListener("click",()=>{ S=null; render(); });
}

function render(){
  if(!S) return renderTitle();
  if(S.phase==="play") return renderPlay();
  if(S.mode==="daily") return renderDailyResult();
  if(S.phase==="reveal") return renderPracticeReveal();
  return renderPracticeSummary();
}

/* ---- survive a republish without losing the run ---- */
const SAVE_VERSION=4;
function snapshot(){
  if(!S) return {};
  return {ver:SAVE_VERSION, mode:S.mode, bandKey:S.bandKey, n:S.n, i:S.i, score:S.score,
          phase:S.phase, guess:S.guess, sliderT:S.sliderT, hintShown:S.hintShown,
          q:S.q, results:S.results, seen:S.seen?[...S.seen]:[]};
}
function usableQuestion(q){
  return !!q && !!q.item && !!q.target && !!UNITS[q.u]
      && isFinite(q.answer) && q.answer>0
      && val(q.item,q.u)!==null && val(q.target,q.u)!==null;
}
function start(data){
  try{
    if(data && data.ver===SAVE_VERSION && BANDS[data.bandKey] && usableQuestion(data.q)){
      S={...data, band:BANDS[data.bandKey], seen:new Set(data.seen||[])};
      return render();
    }
  }catch(e){}
  S=null;
  render();
}
try{ window.claude?.hot?.snapshot?.(snapshot); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
</script>
